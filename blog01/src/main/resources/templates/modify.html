<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <input type="hidden" th:value="${article.no}" id="no">
        <input type="text" class="form-control" id="title" th:value="${article.title}">
        <textarea  id="body" class="form-control" cols="30" rows="10" th:text="${article.body}"></textarea>
        <div class="text-center">
            <button id="modify" class="btn btn-primary">수정</button>
        </div>
    </div>
    <script>
        var no=document.getElementById("no").value      // 글번호
        var modifyBtn=document.getElementById("modify") //수정버튼
        modifyBtn.addEventListener("click",function(){
            //수정버튼 클릭시
            var title=document.getElementById("title").value
            var body=document.getElementById("body").value
            fetch("/api/article/modify/"+no,{
                method:"post",
                headers:{
                    "content-type":"application/json"
                },
                body:JSON.stringify({
                    title:title,
                    body:body
                })
            })
                .then(function(response){
                    return response.json()
                })
                .then(function(json){
                    if(json.success){   //글수정
                        location.href="/view/"+no
                    }
                })
        })
    </script>

</body>
</html>
