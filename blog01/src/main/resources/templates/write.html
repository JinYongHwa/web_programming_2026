<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container mt-4">
        <input id="title" class="form-control" placeholder="제목">
        <textarea id="body" class="form-control mt-2" placeholder="글 내용을 작성해주세요" cols="30" rows="10"></textarea>
        <div class="text-center mt-2">
            <button id="submit" class="btn btn-primary">글쓰기</button>
        </div>
    </div>

    <script>
        var submitBtn=document.getElementById("submit")
        //글쓰기 버튼이 클릭 됐을때
        submitBtn.addEventListener("click",function(){
            //alert("글쓰기 버튼 클릭")
            var title=document.getElementById("title").value    //사용자가 작성한 글제목
            var body=document.getElementById("body").value      //사용자가 작성한 글내용

            fetch("/api/article",{
                method:"post",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    title:title,
                    body:body
                })
            }).then(function(response){
                return response.json()
            }).then(function(json){
                console.log(json)
                if(json.success){   //글쓰기에 성공 했을경우
                    location.href="/view/"+json.article.no      //글보기 페이지로 이동
                }
                else{   //글쓰기에 실패할경우
                    alert(json.message)     //서버에서 보낸 실패 메세지 alert으로 띄우기
                }
            })


        })
    </script>
</body>
</html>
